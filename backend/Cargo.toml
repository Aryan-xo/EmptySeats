[package]
name = "railway-seats"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
chrono = "0.4.45"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "brotli", "deflate", "cookies", "http2", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
